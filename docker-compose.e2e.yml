# Stack aislado y desechable para las pruebas E2E de Playwright (front/e2e/).
# Lo levanta y destruye front/e2e/support/global-setup.ts; manualmente:
#   docker compose -f docker-compose.e2e.yml -p riesgoti-e2e up -d --wait
#   docker compose -f docker-compose.e2e.yml -p riesgoti-e2e down -v
# No comparte base de datos, broker ni storage/ (PDFs, evidencias, índices FAISS) con el stack de desarrollo:
# solo reutiliza la imagen ya construida y la caché del modelo de embeddings.
name: riesgoti-e2e

x-backend-env: &backend-env
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: riesgo_ti_e2e
  DB_USER: postgres
  DB_PASSWORD: postgres
  DATABASE_URL: postgresql://postgres:postgres@db:5432/riesgo_ti_e2e
  CELERY_BROKER_URL: redis://redis:6379/0
  CORS_ALLOWED_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
  # La suite inicia sesión decenas de veces por ejecución; el límite de desarrollo es 10/min.
  LOGIN_THROTTLE_RATE: 1000/min
  PYTHONUNBUFFERED: "1"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: riesgo_ti_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d riesgo_ti_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    image: riesgo_ti-backend:latest
    build:
      context: ./back
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_riesgoti && python manage.py runserver 0.0.0.0:8000"
    working_dir: /app
    env_file:
      - ./back/.env
    environment:
      <<: *backend-env
      # El servidor carga el modelo de embeddings antes de abrir el puerto (≈40 s), así el healthcheck solo lo da por
      # sano ya caliente y la prueba de conectividad IA no compite con el worker recién sembrado (hallazgo H-01).
      # Debe coincidir con modelo_embedding de la configuración semilla (seed_riesgoti).
      RIESGOTI_PRELOAD_EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-mpnet-base-v2
    ports:
      - "8001:8000"
    volumes:
      - ./back:/app
      - e2e_storage:/app/storage
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Sano solo cuando migraciones y semilla terminaron y el servidor responde.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 20s

  celery_worker:
    image: riesgo_ti-backend:latest
    command: celery -A config worker -l info --pool=solo
    working_dir: /app
    env_file:
      - ./back/.env
    environment: *backend-env
    volumes:
      - ./back:/app
      - e2e_storage:/app/storage
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Las pruebas que registran incidencias o cargan PDFs necesitan el worker consumiendo la cola.
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 5s
      timeout: 15s
      retries: 24
      start_period: 10s

volumes:
  e2e_storage:
  huggingface_cache:
    external: true
    name: riesgo_ti_huggingface_cache
